  punjab_in:
    label: "Punjab, India (rice-wheat system)"
    scale_note: "State-level recommendations (PAU Package of Practices); transplanting date notified each year. Rice and wheat are grown in the same year (kharif then rabi)."
    crops:
      wheat:
        crop_id: winter_wheat
        plant: {begin: "10-22", most_active: ["11-01", "11-15"], end: "11-28"}
        harvest: {begin: "03-16", most_active: ["04-04", "04-18"], end: "05-05"}
        double_after: [rice, cotton, corn]
        note: "PAU: first fortnight of November optimum (4th week Oct - 4th week Nov by variety); later sowing raises heat (grain shrivelling) risk. Harvest DERIVED = PAU sowing dates + PAU variety maturity (145-158 d; most_active uses about 154 d), not a published harvest calendar. Grown as the second (rabi) crop after rice in the same year."
        sources: [pau_rabi_2025, pau_wheat]
      rice:
        plant: {begin: "06-10", most_active: ["06-20", "07-10"], end: "07-15"}
        harvest: {begin: "09-21", most_active: ["10-09", "10-29"], end: "11-09"}
        note: "Plant = transplanting. Act floor June 10 (the state notifies a date each year, recent years later); PAU recommends 20 June - 10 July, PR 126 by 15 July. Harvest DERIVED = transplanting dates + PAU maturity 93-117 days after transplanting (most_active uses 111 d), not a published harvest calendar."
        sources: [pau_kharif_2026, punjab_act2009]
      cotton:
        plant: {begin: "04-01", most_active: null, end: "05-15"}
        harvest: {begin: "09-15", most_active: null, end: "11-30"}
        note: "PAU: sow 1 April - 15 May; picking period mid-September to November."
        sources: [pau_kharif_2026]
      corn:
        plant: {begin: "05-25", most_active: null, end: "06-30"}
        harvest: {begin: "08-28", most_active: null, end: "10-07"}
        note: "Kharif maize. PAU: sow last week of May to end of June; recommended hybrids mature in about 95-99 days. Harvest DERIVED = sowing dates + 95-99 d, not a published harvest calendar. PAU lists Maize-Wheat among recommended rotations."
        sources: [pau_kharif_2026]
      chickpea:
        plant: {begin: "10-10", most_active: ["10-25", "11-10"], end: "11-10"}
        harvest: null
        note: "PAU gram: rainfed desi 10-25 October, irrigated desi and kabuli 25 October - 10 November. Harvest not dated by PAU (varieties mature in about 153-170 days)."
        sources: [pau_rabi_2025]
    covers: {}

  mato_grosso_br:
    label: "Mato Grosso, Brazil (soy - safrinha system)"
    scale_note: "State legal soybean calendar + Conab month-resolution stage tables for Norte Mato-grossense (mesoregion). Soybean and safrinha corn are grown in the same season."
    crops:
      soybean:
        plant: {begin: "09-07", most_active: ["09-07", "10-31"], end: "01-07"}
        harvest: {begin: "01-01", most_active: null, end: "03-31"}
        note: "Legal sowing window 2026/27 (begin/end); soybean-free period (vazio sanitario) Jun 8 - Sep 6. No live soybean allowed in that period. most_active = Conab sowing months for Norte Mato-grossense (Sep-Oct); harvest = Conab harvest months (Jan-Mar). Month resolution."
        sources: [mt_soy_2026, conab_2026_n5]
      cotton:
        plant: {begin: "12-01", most_active: null, end: "12-31"}
        harvest: {begin: "06-01", most_active: null, end: "08-31"}
        note: "First-crop cotton, Norte Mato-grossense (Conab: sown December, harvested June-August). Second-crop cotton after soybean is sown in January (Conab) and is not modelled separately yet."
        sources: [conab_mt_cotton, conab_2026_n5]
      corn:
        plant: {begin: "01-01", most_active: null, end: "02-28"}
        harvest: {begin: "06-01", most_active: null, end: "07-31"}
        double_after: [soybean]
        note: "Second-crop (safrinha) corn sown right after the soybean harvest. Conab Norte Mato-grossense: sown January-February, harvested June-July (month resolution). First-crop (summer) corn is a small share in MT and is not modelled."
        sources: [conab_2026_n5]
    covers:
      sunn_hemp:
        seed: null
        terminate: null
        note: "Must not host soybean in the vazio period; no dated window sourced."
        sources: []
