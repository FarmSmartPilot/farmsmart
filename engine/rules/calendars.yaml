# FarmSmart planting / harvest calendars per pilot region (agronomy agent)
# --------------------------------------------------------------------------
# Window format (month-day strings, "MM-DD"):
#   plant:   {begin, most_active: [start, end], end}
#   harvest: {begin, most_active: [start, end], end}
# A window that crosses the new year is allowed (begin later than end).
# null = no citable value found for this region (do not fill by guessing).
# Relative windows (cover crops) use:
#   relative: {anchor: first_fall_frost | cash_planting | cash_harvest, days: [min, max]}
#   negative days = before the anchor; positive = after. The engine resolves the
#   anchor from the region's frost climatology (NASA POWER / station data).
# Scale: US windows are STATE level (NASS AH-628), not county or field level.
# NASS AH-628 data are 2010 and describe "usual" dates; local practice can differ.
# Where AH-628's crop-section table and its by-state page disagree (e.g. Iowa corn
# harvest), the by-state page is used.
# --------------------------------------------------------------------------
schema_version: 1

sources:
  nass_ah628: {cite: "USDA NASS 2010, Field Crops Usual Planting and Harvesting Dates, Agricultural Handbook 628 (state pages for California, Iowa, Kansas)", url: "https://downloads.usda.library.cornell.edu/usda-esmis/files/vm40xr56k/dv13zw65p/w9505297d/planting-10-29-2010.pdf"}
  fao56_t11: {cite: "Allen et al. 1998, FAO-56 Table 11 (plant date and stage lengths by region)", url: "https://www.fao.org/4/X0490E/x0490e0b.htm"}
  sare_rye: {cite: "SARE, Managing Cover Crops Profitably, Cereal Rye (seed late summer to mid-fall in Zones 3-7; kill at least 10 days before corn)", url: "https://www.sare.org/publications/managing-cover-crops-profitably/nonlegume-cover-crops/cereal-rye/"}
  sare_oats: {cite: "SARE, Managing Cover Crops Profitably, Oats (seed 40-60 days before first killing frost)", url: "https://www.sare.org/publications/managing-cover-crops-profitably/nonlegume-cover-crops/oats/"}
  sare_crimson: {cite: "SARE, Managing Cover Crops Profitably, Crimson Clover (seed 6-8 weeks before average first frost)", url: "https://www.sare.org/publications/managing-cover-crops-profitably/legume-cover-crops/crimson-clover/"}
  sare_vetch: {cite: "SARE, Managing Cover Crops Profitably, Hairy Vetch (plant 30-45 days before killing frost; corn about 10 days after late-April/early-May kill)", url: "https://www.sare.org/publications/managing-cover-crops-profitably/legume-cover-crops/hairy-vetch/"}
  rma_mgr19017: {cite: "USDA RMA Managers Bulletin MGR-19-017 (NRCS Cover Crop Termination Guidelines v4, June 2019, apply from 2020 crop year)", url: "https://rma.usda.gov/policy-procedure/bulletins-memos/managers-bulletin/2019/mgr-19-017"}
  scic_2026: {cite: "APAS news release 26 May 2026 (SCIC final seeding deadline June 20)", url: "https://apas.ca/pub/documents/News%20Releases/2026/apas-news-release---request-for-clarity-on-crop-insurnace-seeding-deadlines-may-26-2026.pdf"}
  sk_winter_wheat: {cite: "Grainews, Winter wheat and crop insurance deadlines (seeding after Sept 15 loses winterkill coverage; older source)", url: "https://www.grainews.ca/features/winter-wheat-and-crop-insurance-deadlines"}
  mb_agclimate: {cite: "Manitoba Agriculture, Agricultural Climate of Manitoba, Table 1 days to maturity", url: "https://gov.mb.ca/agriculture/weather/agricultural-climate-of-mb.html"}
  pau_wheat: {cite: "PAU Ludhiana via The Tribune: first fortnight of November optimum; sow by Nov 15", url: "https://www.tribuneindia.com/news/punjab/sow-wheat-by-nov-15-to-prevent-grain-shrivelling-pau-to-farmers-448039"}
  punjab_act2009: {cite: "Punjab Preservation of Subsoil Water Act 2009 (no nursery before May 10, no transplanting before June 10; state notifies the date each year)", url: "https://leap.unep.org/en/countries/in/national-legislation/punjab-preservation-subsoil-water-act-2009"}
  mt_soy_2026: {cite: "CNA / IN Conjunta Sedec-Indea-MT: soybean-free period Jun 8 - Sep 6 2026; sowing allowed Sep 7 2026 - Jan 7 2027", url: "https://cnabrasil.org.br/noticias/calendario-da-soja-em-mt-mantem-vazio-sanitario-de-junho-a-setembro-para-2026"}
  conab_mt_cotton: {cite: "Conab Mato Grosso crop bulletin: cotton planting normally starts in December", url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/safras/safra-de-graos/boletim-da-safra-de-graos/5o-levantamento-safra-2025-26/e-book_boletim-de-safras-5o-levantamento_2026.pdf"}
  conab_calendar: {cite: "Conab, Calendario de Plantio e Colheita de Graos no Brasil 2022 (to read for MT month windows)", url: "https://www.gov.br/conab/pt-br"}
  sk_crop_report_2026: {cite: "Saskatchewan Ministry of Agriculture, Crop Report 2026 (weekly). Province-wide all-crop progress, 5-year average 2021-2025: seeded 12% May 4, 28% May 11, 55% May 18, 74% May 25, 91% Jun 1, 97% Jun 8; combined 6% Aug 10, 15% Aug 17, 24% Aug 24, 39% Aug 31, 58% Sep 7, 71% Sep 14, 82% Sep 21, 91% Sep 28, 97% Oct 5", url: "https://www.saskatchewan.ca/business/agriculture-natural-resources-and-industry/agribusiness-farmers-and-ranchers/market-and-trade-statistics/crops-statistics/crop-report/previous-crop-reports"}
  pau_kharif_2026: {cite: "Punjab Agricultural University, Package of Practices for Crops of Punjab, Kharif 2026 (Vol. 43 No. 1): rice transplanting 20 June - 10 July, PR 126 not beyond 15 July; recommended varieties mature 93-117 days after transplanting (most about 105-112); cotton sowing 1 April - 15 May; cotton picking period mid-September to November; kharif maize sown last week of May to end of June, hybrids mature in about 95-99 days; recommended rotations include Rice-Wheat and Maize-Wheat", url: "https://www.pau.edu/content/ccil/pf/pp_kharif.pdf"}
  pau_rabi_2025: {cite: "Punjab Agricultural University, Package of Practices for Crops of Punjab, Rabi 2025-26 (Vol. 42 No. 2): wheat optimum first fortnight of November, varieties sown 4th week October - 4th week November, timely-sown varieties mature in about 145-158 days; irrigated gram sown 25 October - 10 November, varieties mature in about 153-170 days", url: "https://www.pau.edu/content/ccil/pf/pp_rabi.pdf"}
  conab_2026_n5: {cite: "Conab, Acompanhamento da Safra Brasileira de Graos v.13 safra 2025/26 n.5 (Feb 2026), crop-stage tables for Norte Mato-grossense: soja S Sep-Oct, C Jan-Mar (Quadro 7); milho segunda safra S Jan-Feb, C Jun-Jul (Quadro 6); algodao 1a safra S Dec, C Jun-Aug (Quadro 1). Month resolution", url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/safras/safra-de-graos/boletim-da-safra-de-graos/5o-levantamento-safra-2025-26/e-book_boletim-de-safras-5o-levantamento_2026.pdf"}

