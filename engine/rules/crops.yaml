    root_depth_m: [1.0, 1.7]
    rusle_c_growing: 0.40
    residue_cover_after_harvest: [0.80, 0.95]
    n_fixing: false
    n_need_kg_ha: null
    n_credit_next_kg_ha: null
    ph_range: [5.0, 7.0]
    ph_abs: [4.5, 8.5]
    drainage_ok: null
    texture_ok: null
    max_slope_pct: null
    equipment: [row_crop_planter, combine]
    pest_host_groups: [corn_rootworm, fusarium_head_blight_inoculum, tar_spot, gray_leaf_spot]
    typical_yield_unit: bu/acre
    nass_commodity: CORN
    cdl_codes: [1]
    market_notes: "Deep commodity market (elevators, ethanol, feed). Silage needs forage_harvester and a livestock buyer."
    blurb_en: "Grain corn is a summer cash crop with a deep market, and its heavy residue helps cover the soil."
    blurb_es: "El maíz grano es un cultivo comercial de verano con mercado amplio, y su abundante rastrojo protege el suelo."
    check_first_en:
      - "corn rootworm pressure if corn follows corn"
      - "a nitrogen rate from your local extension calculator"
      - "head scab risk if wheat follows corn"
    check_first_es:
      - "presión del gusano de la raíz si va maíz después de maíz"
      - "la dosis de nitrógeno según la calculadora de extensión local"
      - "riesgo de fusariosis de la espiga si después va trigo"
    notes: >-
      frost_kill_c from ISU (28 F killing freeze), not ECOCROP (blank). ECOCROP drainage/texture blank for Zea mays.
      n_need_kg_ha null: use the regional MRTN calculator (rate depends on previous crop and prices).
      Residue 0.80 at 60-120 bu/ac, 0.95 at 120-200 bu/ac; silage 0.15. Corn residue hosts Fusarium graminearum (FHB inoculum for wheat).
    references: [fao56_t11, fao56_t12, fao56_t22, fao_iwm, ecocrop, isu_frost, ukagr202, fp_corn_gdd, mb_agclimate, isu_pm1901a, omafra_usle, cdl_legend, dill_macky2000]

