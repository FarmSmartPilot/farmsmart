# FarmSmart crop trait knowledge base (agronomy agent)
# --------------------------------------------------------------------------
# Rule: every number below is copied from the source named in `references`
# (keys resolve in `sources:`). Nothing is estimated. Where no citable value
# was found the field is null and `notes` says why. Ranges are [min, max].
#
# Field conventions
#   gdd_base_c          base temperature (deg C) for growing degree days
#   gdd_required        {value: [min,max], unit, base_c, note}; null when no source
#   days_to_maturity    [min,max] calendar days (Manitoba Table 1 for prairie crops,
#                       else FAO-56 Table 11 total for the row used in stage_days)
#   min_frost_free_days lower bound of days_to_maturity for frost-sensitive annuals
#                       (proxy, see notes); null for winter / perennial crops
#   frost_kill_c        ECOCROP KTMPR = absolute killing temperature during rest,
#                       unless notes name another source
#   heat_stress_c       ECOCROP TOPMX = upper limit of the optimal temperature range
#   water_need_mm       FAO Irrigation Water Management Manual 3, Table 14
#                       ("rough estimates", total growing period, often by crop group)
#   drought_tolerance   inverted from FAO IWM Table 14 "sensitivity to drought":
#                       low -> high, low-medium -> med, medium-high -> low, high -> low
#   kc / stage_days     FAO-56 Table 12 / Table 11 (row named in kc_stage_row).
#                       Kc ini where Table 12 leaves it blank uses the crop-group
#                       value printed on the group heading line of Table 12.
#   root_depth_m        FAO-56 Table 22 maximum effective rooting depth Zr [min,max]
#   rusle_c_growing     OMAFRA Factsheet 23-005 Table 4 "crop type factor" (annual,
#                       generalised). Multiply by Table 5 tillage factor (fall plow 1.0,
#                       spring plow 0.90, mulch till 0.60, ridge 0.35, zone/no-till 0.25)
#                       to get C. Not RUSLE2 daily values (RUSLE2 database not parsed).
#   residue_cover_after_harvest  ISU PM 1901a Table 1 (adapted from MWPS-45), fraction
#   ph_range            ECOCROP optimal pH [PHOPMN, PHOPMX]; ph_abs = absolute range
#   drainage_ok         NRCS drainage classes mapped from ECOCROP DRAR (absolute range):
#                       "well (dry spells)" -> well, moderately_well
#                       "excessive (dry/moderately dry)" -> somewhat_excessive, excessive
#                       "poorly (saturated >50% of year)" -> somewhat_poorly, poorly, very_poorly
#                       (the mapping is our documented assumption, not an NRCS table)
#   texture_ok          ECOCROP TEXTR (absolute texture range): heavy / medium / light / organic
#   max_slope_pct       null for every crop: no crop-specific citable limit found.
#                       Slope is handled by rules.yaml (slope > 5% erosion rule).
#   n_credit_next_kg_ha converted from lb N/acre x 1.121
#   cdl_codes           USDA NASS Cropland Data Layer class codes (legend read from the
#                       CDL metadata file)
# --------------------------------------------------------------------------
schema_version: 1

sources:
  fao56_t11: {cite: "Allen et al. 1998, FAO Irrigation & Drainage Paper 56, Table 11 (stage lengths)", url: "https://www.fao.org/4/X0490E/x0490e0b.htm"}
  fao56_t12: {cite: "Allen et al. 1998, FAO-56, Table 12 (single Kc)", url: "https://www.fao.org/4/X0490E/x0490e0b.htm"}
  fao56_t22: {cite: "Allen et al. 1998, FAO-56, Table 22 (rooting depth Zr, depletion p)", url: "https://www.fao.org/4/X0490E/x0490e0e.htm"}
  fao_iwm: {cite: "Brouwer & Heibloem 1986, FAO Irrigation Water Management Training Manual 3, Tables 6 and 14", url: "https://www.fao.org/4/s2022e/s2022e07.htm"}
  ecocrop: {cite: "FAO ECOCROP database (values read from a public export of the ECOCROP DB; re-verify on the FAO portal before publication)", url: "https://gaez.fao.org/pages/ecocrop"}
  isu_pm1901a: {cite: "Al-Kaisi & Hanna, Iowa State Univ. Extension PM 1901a, Residue Management & Cultural Practices (rev. 2009), Table 1", url: "https://www.mssoy.org/sites/default/files/documents/isu-pm1901a.pdf"}
  omafra_usle: {cite: "McKague 2023, OMAFRA Factsheet 23-005 Universal Soil Loss Equation, Tables 4-5", url: "https://www.ontario.ca/page/universal-soil-loss-equation"}
  canola_council_stages: {cite: "Canola Council of Canada, Canola Encyclopedia, Growth stages: emergence 4-15 d after seeding; seeding to first flower 40-60 d; main-stem flowering 14-21 d; seed filling complete about 35-45 d after first flower; lower pods ripe 40-60 d after first flower", url: "https://www.canolacouncil.org/canola-encyclopedia/crop-development/growth-stages/"}
  mb_agclimate: {cite: "Manitoba Agriculture, Agricultural Climate of Manitoba (Table 1 days to maturity; Table 2 base temperatures; GDD text)", url: "https://gov.mb.ca/agriculture/weather/agricultural-climate-of-mb.html"}
  isu_frost: {cite: "Licht & Archontoulis 2014, ISU Integrated Crop Management, How much risk of frost do you have (killing freeze 28 F)", url: "https://crops.extension.iastate.edu/cropnews/2014/09/how-much-risk-frost-do-you-have"}
  cpn_soy_frost: {cite: "Crop Protection Network, Frost injury in soybean (28 F killing freeze)", url: "https://cropprotectionnetwork.org/encyclopedia/frost-damage-in-soybean"}
  ukagr202: {cite: "Univ. Kentucky AGR-202 citing ISU PMR 1009 (86/50 GDD method, base 50 F)", url: "https://publications.ca.uky.edu/sites/publications.ca.uky.edu/files/agr202.pdf"}
  fp_corn_gdd: {cite: "Farm Progress / Wallaces Farmer, Can late-planted corn catch up (ISU examples: ~2,400 to ~2,700 GDD F to black layer)", url: "https://www.farmprogress.com/crops/can-late-planted-corn-catch-up-"}
  ksu_l778: {cite: "Kansas State Univ. L-778, Using Legumes in Crop Rotations (soybean credit about 40 lb N/acre)", url: "https://bookstore.ksre.ksu.edu/pubs/L778.pdf"}
  uw_a3517: {cite: "Laboski & Peters, UW Extension A3517 Nutrient application guidelines (soybean first-year credit 40 lb N/acre)", url: "https://corn.aae.wisc.edu/Management/pdfs/A3517.pdf"}
  umn_alfalfa: {cite: "Univ. Minnesota Extension, Tools to predict N needs of corn following alfalfa (50/100/150 lb N/acre by stand)", url: "https://extension.umn.edu/corn-planting/tools-predict-nitrogen-needs-corn-following-alfalfa"}
  uw_legumes: {cite: "UW IPCM, Using legumes (red clover first-year credit = 80% of alfalfa credit for similar stand)", url: "https://ipcm.wisc.edu/wp-content/uploads/sites/54/2022/11/Usinglegumes.pdf"}
  preissel2015: {cite: "Preissel et al. 2015, Field Crops Research (next-crop N cut 23-31 kg N/ha after grain legumes)", url: "https://doi.org/10.1016/j.fcr.2015.01.012"}
  sare_rye: {cite: "SARE, Managing Cover Crops Profitably 3rd ed., Cereal Rye", url: "https://www.sare.org/publications/managing-cover-crops-profitably/nonlegume-cover-crops/cereal-rye/"}
  sare_oats: {cite: "SARE, Managing Cover Crops Profitably 3rd ed., Oats", url: "https://www.sare.org/publications/managing-cover-crops-profitably/nonlegume-cover-crops/oats/"}
  sare_vetch: {cite: "SARE, Managing Cover Crops Profitably 3rd ed., Hairy Vetch", url: "https://www.sare.org/publications/managing-cover-crops-profitably/legume-cover-crops/hairy-vetch/"}
  sare_crimson: {cite: "SARE, Managing Cover Crops Profitably 3rd ed., Crimson Clover", url: "https://www.sare.org/publications/managing-cover-crops-profitably/legume-cover-crops/crimson-clover/"}
  osu_sag5: {cite: "Ohio State Univ. Extension SAG-5, Oilseed radish (killed at about 20 F)", url: "https://ohioline.osu.edu/factsheet/SAG-5"}
  msu_radish: {cite: "Michigan State Univ., Oil Seed Radish cover crop fact sheet (winterkills at 20 F)", url: "https://www.canr.msu.edu/cover_crops/uploads/files/Oil Seed Radish.pdf"}
  cdl_legend: {cite: "USDA NASS Cropland Data Layer metadata, attribute code legend", url: "https://www.nass.usda.gov/Research_and_Science/Cropland/metadata/metadata_ia21.htm"}
  mb_sclerotinia: {cite: "Manitoba Agriculture, Sclerotinia in sunflowers (host list)", url: "https://gov.mb.ca/agriculture/crops/plant-diseases/sclerotinia-sunflowers.html"}
  dill_macky2000: {cite: "Dill-Macky & Jones 2000, Plant Disease 84:71-76 (previous crop residue and FHB)", url: "https://doi.org/10.1094/PDIS.2000.84.1.71"}

