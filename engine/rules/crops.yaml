      OMAFRA factor 0.50 is the "silage corn, beans and canola" class. Fragile residue.
    references: [fao56_t11, fao56_t12, fao56_t22, fao_iwm, ecocrop, isu_frost, cpn_soy_frost, mb_agclimate, isu_pm1901a, omafra_usle, ksu_l778, uw_a3517, mb_sclerotinia, cdl_legend]

