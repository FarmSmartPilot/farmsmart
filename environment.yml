name: fieldshift
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # geospatial
  - gdal
  - rasterio
  - rioxarray
  - pyproj
  - shapely>=2
  - geopandas
  - pyogrio
  - xarray
  - zarr
  - netcdf4
  - h5netcdf
  - h5py
  - rasterstats
  - h3-py>=4
  # data / storage
  - numpy
  - pandas
  - pyarrow
  - duckdb
  - python-duckdb
  - requests
  - requests-cache
  - httpx
  - pystac-client
  - earthaccess
  - pyyaml
  - python-dotenv
  # api
  - fastapi
  - uvicorn
  - pydantic>=2
  - jinja2
  - apscheduler
  - reportlab
  # ml
  - scikit-learn
  - lightgbm
  - shap
  - statsmodels
  - scipy
  - onnx
  - onnxruntime
  - skl2onnx
  - onnxmltools
  - matplotlib
  # qa
  - pytest
  - pip:
      - mapie
      - pymoo
      - exactextract
